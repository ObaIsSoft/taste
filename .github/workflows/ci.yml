name: ci

on:
  push:
  pull_request:

jobs:
  taste-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taste-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check taste_engine tests
      - run: vulture
      - run: pytest -q -m "not browser"
