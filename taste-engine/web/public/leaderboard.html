<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Engine — TrueSkill Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        display: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        stone: {
                            50: '#faf9f6',
                            100: '#f5f4f0',
                            200: '#eae8e1',
                            300: '#dedad0',
                            400: '#c0bbb0',
                            500: '#948f83',
                            600: '#6e695e',
                            700: '#4f4b43',
                            800: '#33312c',
                            900: '#171614',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f4f0;
            color: #171614;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            letter-spacing: -0.015em;
        }

        .hairline-border {
            border: 1px solid #dedad0;
        }
    </style>
</head>
<body class="p-4 md:p-10 selection:bg-stone-900 selection:text-stone-50">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-baseline gap-4 mb-8 pb-5 border-b border-[#dedad0]">
            <div>
                <h1 class="font-display font-bold text-2xl md:text-3xl text-stone-900 tracking-tight">Taste Engine Leaderboard</h1>
                <p class="text-xs font-mono uppercase tracking-[0.16em] text-stone-500 mt-1.5">TrueSkill Ranking Index · Conservative Score: <span class="text-stone-800 font-semibold">μ − 3σ</span></p>
            </div>

            <a href="/" 
               class="px-3.5 py-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 text-xs font-mono tracking-wider uppercase text-stone-50 transition-all flex items-center gap-2 shadow-xs">
                <span>← Return to Arena</span>
            </a>
        </header>

        <!-- Table Container -->
        <div class="bg-white rounded-xl hairline-border overflow-hidden shadow-xs">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead class="bg-[#faf9f6] text-stone-500 uppercase text-[11px] font-mono tracking-[0.14em] border-b border-[#dedad0]">
                        <tr>
                            <th class="py-3.5 px-5 font-medium">Rank</th>
                            <th class="py-3.5 px-5 font-medium">Identifier</th>
                            <th class="py-3.5 px-5 font-medium">Score (μ − 3σ)</th>
                            <th class="py-3.5 px-5 font-medium">Skill (μ)</th>
                            <th class="py-3.5 px-5 font-medium">Uncertainty (σ)</th>
                            <th class="py-3.5 px-5 font-medium">Record (W · L)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-[#eceae3] font-mono text-xs">
                        <tr><td colspan="6" class="p-8 text-center text-stone-400 font-sans">Loading rankings...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!data.leaderboard || data.leaderboard.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-stone-400 font-sans">No ratings recorded in dataset yet.</td></tr>`;
                    return;
                }

                data.leaderboard.forEach((site, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-[#faf9f6] transition-colors';
                    
                    const rankNum = String(index + 1).padStart(2, '0');
                    let rankBadge = `<span class="text-stone-400 font-mono">${rankNum}</span>`;
                    if (index === 0) {
                        rankBadge = `<span class="text-stone-900 font-bold underline decoration-stone-400 font-mono">${rankNum}</span>`;
                    } else if (index < 3) {
                        rankBadge = `<span class="text-stone-900 font-semibold font-mono">${rankNum}</span>`;
                    }

                    tr.innerHTML = `
                        <td class="py-3.5 px-5">${rankBadge}</td>
                        <td class="py-3.5 px-5 font-semibold text-stone-900 hover:text-stone-600">
                            <a href="/data/${site.site_id}/screenshot_full.png" target="_blank" class="flex items-center gap-1.5 group">
                                <span class="underline decoration-stone-300 group-hover:decoration-stone-800 transition-colors">${site.site_id}</span>
                                <svg class="w-3 h-3 text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </td>
                        <td class="py-3.5 px-5 font-bold font-mono text-stone-900 text-sm">${site.score.toFixed(2)}</td>
                        <td class="py-3.5 px-5 text-stone-600 font-mono">${site.mu.toFixed(2)}</td>
                        <td class="py-3.5 px-5 text-stone-400 font-mono">${site.sigma.toFixed(2)}</td>
                        <td class="py-3.5 px-5 text-stone-700 font-mono">
                            <span>${site.wins || 0}W</span>
                            <span class="text-stone-300 px-1">·</span>
                            <span>${site.losses || 0}L</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-stone-500 font-sans">Failed to load leaderboard data.</td></tr>`;
            }
        }
        
        loadLeaderboard();
    </script>
</body>
</html>
