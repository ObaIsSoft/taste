<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Engine Leaderboard — TrueSkill Ratings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                        },
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -15%, rgba(20, 184, 166, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 90% 100%, rgba(16, 185, 129, 0.08), transparent);
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.06);
        }
    </style>
</head>
<body class="p-4 md:p-8 selection:bg-teal-500 selection:text-white">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-400 p-[1px] shadow-md shadow-teal-600/20">
                    <div class="w-full h-full bg-white rounded-[11px] flex items-center justify-center">
                        <svg class="w-5 h-5 text-teal-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.45 1-1 1H7"></path>
                            <path d="M14 14.66V17c0 .55.45 1 1 1h2"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="font-display text-2xl md:text-3xl font-bold tracking-tight text-slate-900">Taste Engine Leaderboard</h1>
                    <p class="text-xs md:text-sm text-slate-500">Ranked by Conservative TrueSkill score: <span class="font-mono text-teal-700 font-semibold">μ - 3σ</span></p>
                </div>
            </div>

            <a href="/" 
               class="px-4 py-2 rounded-xl bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700 hover:text-slate-900 border border-slate-200 shadow-sm transition-all flex items-center gap-2">
                <svg class="w-4 h-4 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Back to Arena</span>
            </a>
        </header>

        <!-- Table Container -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-[11px] font-mono tracking-wider border-b border-slate-200">
                        <tr>
                            <th class="py-3.5 px-5 font-semibold">Rank</th>
                            <th class="py-3.5 px-5 font-semibold">Site Identifier</th>
                            <th class="py-3.5 px-5 font-semibold">Score (μ - 3σ)</th>
                            <th class="py-3.5 px-5 font-semibold">Skill (μ)</th>
                            <th class="py-3.5 px-5 font-semibold">Uncertainty (σ)</th>
                            <th class="py-3.5 px-5 font-semibold">Record (W - L)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 font-mono text-xs">
                        <tr><td colspan="6" class="p-8 text-center text-slate-400 font-sans">Loading rankings from Supabase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function loadLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                if (!data.leaderboard || data.leaderboard.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-sans">No ratings found in the dataset yet.</td></tr>`;
                    return;
                }

                data.leaderboard.forEach((site, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50/80 transition-colors';
                    
                    let rankBadge = `<span class="text-slate-400">#${index + 1}</span>`;
                    if (index === 0) {
                        rankBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-bold">🥇 1st</span>`;
                    } else if (index === 1) {
                        rankBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200 text-[11px] font-bold">🥈 2nd</span>`;
                    } else if (index === 2) {
                        rankBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-amber-100/60 text-amber-900 border border-amber-200 text-[11px] font-bold">🥉 3rd</span>`;
                    }

                    tr.innerHTML = `
                        <td class="py-4 px-5">${rankBadge}</td>
                        <td class="py-4 px-5 font-semibold text-teal-700 hover:text-teal-900">
                            <a href="/data/${site.site_id}/screenshot_full.png" target="_blank" class="flex items-center gap-1.5 group">
                                <span>${site.site_id}</span>
                                <svg class="w-3 h-3 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </td>
                        <td class="py-4 px-5 font-bold font-sans text-slate-900 text-sm">${site.score.toFixed(2)}</td>
                        <td class="py-4 px-5 text-slate-600">${site.mu.toFixed(2)}</td>
                        <td class="py-4 px-5 text-slate-400">${site.sigma.toFixed(2)}</td>
                        <td class="py-4 px-5">
                            <span class="text-emerald-600 font-semibold">${site.wins || 0}W</span>
                            <span class="text-slate-300 px-1">-</span>
                            <span class="text-rose-500 font-semibold">${site.losses || 0}L</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-sans">Failed to load leaderboard.</td></tr>`;
            }
        }
        
        loadLeaderboard();
    </script>
</body>
</html>
