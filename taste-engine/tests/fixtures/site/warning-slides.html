<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slides Studio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Helvetica, sans-serif; }
  #track { transition: transform 0.6s ease; }
  .slide { height: 100vh; display: grid; place-items: center; font-size: 72px; color: #fff; }
  .slide:nth-child(1) { background: #1e3a8a; } .slide:nth-child(2) { background: #b45309; }
  .slide:nth-child(3) { background: #166534; } .slide:nth-child(4) { background: #6b21a8; }
  #warning { position: fixed; inset: 0; z-index: 10; background: #000; color: #f87171;
             display: grid; place-content: center; gap: 16px; text-align: center; }
</style>
</head>
<body>
<div id="track">
  <div class="slide">One</div><div class="slide">Two</div><div class="slide">Three</div><div class="slide">Four</div>
</div>
<div id="warning">
  <p>Heads up: this site contains fast motion and flashing colours.</p>
  <button id="okay">Okay</button>
  <button>Accessibility mode</button>
</div>
<script>
  document.getElementById('okay').addEventListener('click', () => document.getElementById('warning').remove());
  let slide = 0, busy = false;
  window.addEventListener('wheel', (event) => {
    if (busy || event.deltaY <= 0 || slide >= 3) return;  // one slide per gesture, none while moving
    busy = true;
    slide += 1;
    document.getElementById('track').style.transform = `translateY(-${slide * 100}vh)`;
    setTimeout(() => { busy = false; }, 1200);
  }, { passive: true });
</script>
</body>
</html>
