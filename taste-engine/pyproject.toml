[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taste-engine"
version = "2.0.0"
description = "Learns design taste from designer votes on captured websites."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "playwright==1.62.0",
  "pillow>=10.4",
  "numpy>=1.26",
  "anthropic>=1.11,<2",
  "supabase>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "vulture>=2.11",
  "flask>=3.0,<4",  # the voting API tests
]

[project.scripts]
taste = "taste_engine.cli:main"

[tool.setuptools.packages.find]
include = ["taste_engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "data", "data_v1_archive", "results", "config.py", "pipeline.py", "*.py.bak"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# in-page JavaScript and CSS payloads keep their own line lengths
"taste_engine/capture/js.py" = ["E501"]
"taste_engine/capture/degrade.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: needs installed Playwright browsers",
  "postgres: needs local Postgres binaries (PG_BIN)",
]

[tool.vulture]
paths = ["taste_engine"]
min_confidence = 80
